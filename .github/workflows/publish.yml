name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          registry-url: https://registry.npmjs.org
          node-version-file: package.json
          cache: yarn
      - run: |
          set -e
          yarn install --frozen-lockfile
          yarn build

          echo "Running publishing step"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Triggered via workflow_dispatch — using latest git tag"
            REF="$(git describe --tags --abbrev=0)"
          else
            echo "Triggered via tag push"
            REF="${GITHUB_REF_NAME}"
          fi

          VERSION="${REF#v}"   

          echo "Publishing version $VERSION"

          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"

            if [[ ! "$TAG" =~ ^[0-9]+$ ]]; then
              echo "Publishing prerelease with tag '$TAG'"
              npm publish --tag "$TAG"
              exit 0
            fi
          fi

          echo "Publishing stable release with tag 'latest'"
          npm publish

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: teneplaysofficial/docker-publish@eb24f3ec16036eaf380a2c8ef7e9330e6eab01cb # v1
        with:
          image_repo: tenedev/release-hub
          version: ${{ github.ref_name }}
          docker_username: tenedev
          docker_password: ${{ secrets.DOCKERHUB_TOKEN }}
